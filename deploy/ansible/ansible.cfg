[defaults]
roles_path = roles
inventory = inventories/dev/hosts.yml
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
host_key_checking = True
retry_files_enabled = False
forks = 5
# vault password: pass --ask-vault-pass or --vault-password-file .vault_pass (never commit that file)

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
