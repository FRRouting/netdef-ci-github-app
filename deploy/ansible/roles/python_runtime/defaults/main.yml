---
# CPython built from the official python.org source tarball and installed side by side (`make altinstall`),
# so the system Python is never touched. Version/checksum chosen on 2026-11-05: latest 3.13 release (3.13.18), the
# project's Python line (doc/03-technical-decisions.md).
python_runtime_version: "3.13.18"
python_runtime_sha256: "abb0102e6d4ae027509bcb82327d9dd85515b44a3ba8ad538cfc5e9847029f68"
python_runtime_url: "https://www.python.org/ftp/python/{{ python_runtime_version }}/Python-{{ python_runtime_version }}.tar.xz"
python_runtime_prefix: "/opt/python/{{ python_runtime_version }}"
python_runtime_src_dir: /usr/local/src
# Profile-guided optimisation makes the build much longer; enable it when build time does not matter.
python_runtime_optimizations: false
python_runtime_build_jobs: "{{ ansible_facts['processor_vcpus'] | default(2) }}"

# true = use the interpreter packaged by the distribution (e.g. python3.13 on Debian 13) instead of building one.
# python_runtime_version is then the major.minor of that package ("3.13") and nothing is downloaded or compiled.
python_runtime_system: false
python_runtime_system_bin: "/usr/bin/python{{ python_runtime_version.split('.')[:2] | join('.') }}"
