---
python_runtime_packages:
  - build-essential
  - ca-certificates
  - curl
  - xz-utils
  - libssl-dev
  - zlib1g-dev
  - libffi-dev
  - libsqlite3-dev
  - libbz2-dev
  - liblzma-dev
  - libreadline-dev
  - libncurses-dev
  - uuid-dev
  - libzstd-dev
# Packages of the distribution interpreter (python_runtime_system: true).
python_runtime_system_packages:
  - "python{{ python_runtime_version.split('.')[:2] | join('.') }}"
  - "python{{ python_runtime_version.split('.')[:2] | join('.') }}-venv"
