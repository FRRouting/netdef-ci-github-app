---
- name: Load OS specific package names
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Install build dependencies
  ansible.builtin.package:
    name: "{{ ruby_runtime_packages }}"
    state: present

- name: Check whether the interpreter is already installed
  ansible.builtin.stat:
    path: "{{ ruby_runtime_prefix }}/bin/ruby"
  register: ruby_runtime_binary

- name: Build and install Ruby {{ ruby_runtime_version }}
  when: not ruby_runtime_binary.stat.exists
  block:
    - name: Download the source tarball (checksum pinned)
      ansible.builtin.get_url:
        url: "{{ ruby_runtime_url }}"
        dest: "{{ ruby_runtime_src_dir }}/ruby-{{ ruby_runtime_version }}.tar.gz"
        checksum: "sha256:{{ ruby_runtime_sha256 }}"
        mode: "0644"

    - name: Unpack the source tarball
      ansible.builtin.unarchive:
        src: "{{ ruby_runtime_src_dir }}/ruby-{{ ruby_runtime_version }}.tar.gz"
        dest: "{{ ruby_runtime_src_dir }}"
        remote_src: true
        creates: "{{ ruby_runtime_src_dir }}/ruby-{{ ruby_runtime_version }}/configure"

    - name: Configure
      ansible.builtin.command:
        cmd: ./configure --prefix={{ ruby_runtime_prefix }} --disable-install-doc
        chdir: "{{ ruby_runtime_src_dir }}/ruby-{{ ruby_runtime_version }}"
        creates: "{{ ruby_runtime_src_dir }}/ruby-{{ ruby_runtime_version }}/Makefile"

    - name: Compile
      ansible.builtin.command:
        cmd: "make -j{{ ruby_runtime_build_jobs }}"
        chdir: "{{ ruby_runtime_src_dir }}/ruby-{{ ruby_runtime_version }}"
        creates: "{{ ruby_runtime_src_dir }}/ruby-{{ ruby_runtime_version }}/ruby"

    - name: Install
      ansible.builtin.command:
        cmd: make install
        chdir: "{{ ruby_runtime_src_dir }}/ruby-{{ ruby_runtime_version }}"
        creates: "{{ ruby_runtime_prefix }}/bin/ruby"

- name: Verify the interpreter version and its native extensions (openssl, psych, zlib)
  ansible.builtin.command:
    argv:
      - "{{ ruby_runtime_prefix }}/bin/ruby"
      - -ropenssl
      - -rpsych
      - -rzlib
      - -e
      - print RUBY_VERSION
  register: ruby_runtime_reported
  changed_when: false
  failed_when: ruby_runtime_reported.rc != 0 or ruby_runtime_reported.stdout != ruby_runtime_version
