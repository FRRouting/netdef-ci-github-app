---
- name: Create the service group
  ansible.builtin.group:
    name: "{{ netdef_ci_group }}"
    system: true

- name: Create the unprivileged service user
  ansible.builtin.user:
    name: "{{ netdef_ci_user }}"
    group: "{{ netdef_ci_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ netdef_ci_home }}"
    create_home: true
    password_lock: true

- name: Create base directories (code is owned by root and read-only for the service)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ netdef_ci_base_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ netdef_ci_releases_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ netdef_ci_config_dir }}"
      owner: root
      group: "{{ netdef_ci_group }}"
      mode: "0750"
    - path: "{{ netdef_ci_keys_dir }}"
      owner: root
      group: "{{ netdef_ci_group }}"
      mode: "0750"
    - path: "{{ netdef_ci_log_dir }}"
      owner: "{{ netdef_ci_user }}"
      group: "{{ netdef_ci_group }}"
      mode: "0750"
  loop_control:
    label: "{{ item.path }}"
