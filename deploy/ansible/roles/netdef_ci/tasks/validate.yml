---
- name: Check the deployment settings (no secret values are printed)
  ansible.builtin.assert:
    that: "{{ item.test }}"
    fail_msg: "{{ item.msg }}"
    quiet: true
  loop:
    - test: netdef_ci_env in ['development', 'production']
      msg: "netdef_ci_env must be 'development' or 'production'."
    - test: netdef_ci_source_strategy in ['git', 'archive']
      msg: "netdef_ci_source_strategy must be 'git' or 'archive'."
    - test: "'REPLACE' not in netdef_ci_repo_url and (netdef_ci_source_strategy == 'archive' or netdef_ci_repo_url | length > 0)"
      msg: "netdef_ci_repo_url is empty or still a placeholder (inventories/<env>/group_vars/all/main.yml)."
    - test: "'REPLACE' not in netdef_ci_version and (netdef_ci_source_strategy == 'archive' or netdef_ci_version | length > 0)"
      msg: "netdef_ci_version is empty or still a placeholder (pass -e netdef_ci_version=<branch|tag|sha>)."
    - test: "netdef_ci_source_strategy == 'git' or (netdef_ci_source_archive | length > 0 and netdef_ci_release_id | length > 0)"
      msg: "The archive strategy needs netdef_ci_source_archive and netdef_ci_release_id."
    - test: "'REPLACE' not in (netdef_ci_settings.CI_URL | default(''))"
      msg: "netdef_ci_settings.CI_URL is still a placeholder (host of the Bamboo server)."
    - test: netdef_ci_database_url | length > 0
      msg: "vault_netdef_ci_database_url is missing: create the encrypted vault.yml (see vault.yml.example) and use --ask-vault-pass."
    - test: netdef_ci_webhook_secret | length >= (16 if netdef_ci_env == 'production' else 1)
      msg: "vault_netdef_ci_webhook_secret is missing (production also requires at least 16 characters)."
    - test: netdef_ci_github_apps | length > 0
      msg: "vault_netdef_ci_github_apps is missing or empty."
    - test: >-
        netdef_ci_github_apps | map(attribute='login') | map('string') | select('match', '^[0-9A-Za-z_-]+$') | list | length
        == netdef_ci_github_apps | length
      msg: "Every entry of vault_netdef_ci_github_apps needs a 'login' (the GitHub App ID)."
  loop_control:
    label: "{{ item.msg[:60] }}"

- name: Warn when the Bamboo credentials are missing
  ansible.builtin.debug:
    msg: >-
      vault_netdef_ci_bamboo_username/password are not set: the service will call Bamboo anonymously and every request
      will fail with 401 unless the service account has a ~/.netrc entry. Verify with: python -m netdef_ci check-bamboo
  when: netdef_ci_bamboo_username | length == 0 or netdef_ci_bamboo_password | length == 0

- name: Check the interpreter built by the python_runtime role
  ansible.builtin.stat:
    path: "{{ netdef_ci_python_bin }}"
  register: netdef_ci_python_stat

- name: Fail when the interpreter is missing
  ansible.builtin.assert:
    that: netdef_ci_python_stat.stat.exists
    fail_msg: "{{ netdef_ci_python_bin }} not found; run the python_runtime role first (playbooks/deploy.yml does)."
    quiet: true
