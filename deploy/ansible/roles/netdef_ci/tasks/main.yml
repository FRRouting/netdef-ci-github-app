---
- name: Validate required variables
  ansible.builtin.include_tasks: validate.yml

- name: Create the service account and directories
  ansible.builtin.include_tasks: user.yml

- name: Install configuration, keys and logrotate rules
  ansible.builtin.include_tasks: config.yml

- name: Fetch the requested version and build its virtualenv
  ansible.builtin.include_tasks: release.yml

- name: Apply database migrations (backward compatible, run with the new release before switching)
  ansible.builtin.include_tasks: migrate.yml

- name: Install systemd units
  ansible.builtin.include_tasks: systemd.yml

- name: Switch the current release
  ansible.builtin.include_tasks: switch.yml

- name: Verify the deployment
  ansible.builtin.include_tasks: healthcheck.yml

- name: Remove old releases
  ansible.builtin.include_tasks: cleanup.yml
