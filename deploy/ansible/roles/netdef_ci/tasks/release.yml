---
- name: Resolve the source from git
  when: netdef_ci_source_strategy == 'git'
  block:
    - name: Update the local repository cache at the requested version
      ansible.builtin.git:
        repo: "{{ netdef_ci_repo_url }}"
        dest: "{{ netdef_ci_base_dir }}/repo.git"
        version: "{{ netdef_ci_version }}"
        bare: true
        key_file: "{{ netdef_ci_git_key_file | default(omit, true) }}"
        accept_newhostkey: true
        force: true

    - name: Resolve the requested version to a commit (branch, tag or SHA)  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: git --git-dir={{ netdef_ci_base_dir }}/repo.git rev-parse --verify --quiet "{{ netdef_ci_version }}^{commit}"
      register: netdef_ci_resolved
      changed_when: false
      failed_when: netdef_ci_resolved.rc != 0 or netdef_ci_resolved.stdout | length != 40

    - name: Name the release after the resolved commit
      ansible.builtin.set_fact:
        netdef_ci_release: "{{ netdef_ci_resolved.stdout[:12] }}"

    - name: Check out the release
      ansible.builtin.git:
        repo: "{{ netdef_ci_base_dir }}/repo.git"
        dest: "{{ netdef_ci_releases_dir }}/{{ netdef_ci_release }}"
        version: "{{ netdef_ci_resolved.stdout }}"
        force: true

- name: Unpack the source archive
  when: netdef_ci_source_strategy == 'archive'
  block:
    - name: Name the release
      ansible.builtin.set_fact:
        netdef_ci_release: "{{ netdef_ci_release_id }}"

    - name: Create the release directory
      ansible.builtin.file:
        path: "{{ netdef_ci_releases_dir }}/{{ netdef_ci_release }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Unpack the archive
      ansible.builtin.unarchive:
        src: "{{ netdef_ci_source_archive }}"
        dest: "{{ netdef_ci_releases_dir }}/{{ netdef_ci_release }}"
        owner: root
        group: root
        creates: "{{ netdef_ci_releases_dir }}/{{ netdef_ci_release }}/Gemfile.lock"

- name: Remember the release directory
  ansible.builtin.set_fact:
    netdef_ci_release_dir: "{{ netdef_ci_releases_dir }}/{{ netdef_ci_release }}"

- name: Check that the release contains the application
  ansible.builtin.stat:
    path: "{{ netdef_ci_release_dir }}/{{ item }}"
  loop: [Gemfile.lock, config.ru, Rakefile]
  register: netdef_ci_app_files

- name: Fail with a clear message when the requested version is not the Ruby application
  ansible.builtin.assert:
    that: netdef_ci_app_files.results | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      Gemfile.lock/config.ru/Rakefile not found in release {{ netdef_ci_release }}: the version "{{ netdef_ci_version }}"
      did not resolve to a commit of this application (is the branch/tag pushed to {{ netdef_ci_repo_url }}?).
    quiet: true

- name: Link the paths the application writes relative to its directory to writable locations
  ansible.builtin.file:
    path: "{{ netdef_ci_release_dir }}/{{ item.path }}"
    src: "{{ item.src }}"
    state: link
    force: true
    follow: false
    owner: root
    group: root
  loop: "{{ netdef_ci_release_links }}"
  loop_control:
    label: "{{ item.path }}"

- name: Read the Bundler version the lockfile was generated with
  ansible.builtin.slurp:
    src: "{{ netdef_ci_release_dir }}/Gemfile.lock"
  register: netdef_ci_lockfile

- name: Remember the Bundler version
  ansible.builtin.set_fact:
    netdef_ci_bundler_version: >-
      {{ (netdef_ci_lockfile.content | b64decode | regex_search('BUNDLED WITH\s+(\S+)', '\1') | default([''], true)) | first }}

- name: Check whether that Bundler version is installed
  ansible.builtin.command:
    argv: ["{{ netdef_ci_ruby_bin_dir }}/gem", list, --installed, --exact, bundler, --version, "{{ netdef_ci_bundler_version }}"]
  register: netdef_ci_bundler_installed
  changed_when: false
  failed_when: false
  when: netdef_ci_bundler_version | length > 0

- name: Install the Bundler version of the lockfile
  ansible.builtin.command:
    argv: ["{{ netdef_ci_ruby_bin_dir }}/gem", install, bundler, --version, "{{ netdef_ci_bundler_version }}", --no-document]
  changed_when: true
  when: netdef_ci_bundler_version | length > 0 and netdef_ci_bundler_installed.rc != 0

- name: Create the Bundler configuration directory of the release
  ansible.builtin.file:
    path: "{{ netdef_ci_release_dir }}/.bundle"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Bundler for the release (gems in vendor/bundle, no development/test groups)
  ansible.builtin.copy:
    dest: "{{ netdef_ci_release_dir }}/.bundle/config"
    content: |
      ---
      BUNDLE_DEPLOYMENT: "true"
      BUNDLE_PATH: "vendor/bundle"
      BUNDLE_WITHOUT: "development:test"
    owner: root
    group: root
    mode: "0644"

- name: Check whether the gems of the release are installed
  ansible.builtin.command:
    cmd: "{{ netdef_ci_bundle }} check"
    chdir: "{{ netdef_ci_release_dir }}"
  environment:
    BUNDLE_GEMFILE: "{{ netdef_ci_release_dir }}/Gemfile"
    PATH: "{{ netdef_ci_ruby_bin_dir }}:/usr/local/bin:/usr/bin:/bin"
  register: netdef_ci_bundle_check
  changed_when: false
  failed_when: false

- name: Install the gems of the release (pinned by Gemfile.lock)
  ansible.builtin.command:
    cmd: "{{ netdef_ci_bundle }} install --jobs {{ netdef_ci_bundle_jobs }}"
    chdir: "{{ netdef_ci_release_dir }}"
  environment:
    BUNDLE_GEMFILE: "{{ netdef_ci_release_dir }}/Gemfile"
    PATH: "{{ netdef_ci_ruby_bin_dir }}:/usr/local/bin:/usr/bin:/bin"
  changed_when: true
  when: netdef_ci_bundle_check.rc != 0
