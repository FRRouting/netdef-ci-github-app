---
# dev inventory. No credentials are stored here.
all:
  children:
    netdef_ci_servers:
      hosts:
        netdef-ci-dev:
          ansible_host: ci2.netdef.org
          ansible_user: root   # SSH account (must be able to sudo)
          # The ssh agent holds many keys; offering all of them triggers "Too many authentication failures",
          # so only one key is offered. Override with: export NETDEF_SSH_KEY=~/.ssh/<other key>
          ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'NETDEF_SSH_KEY') | default('~/.ssh/id_rsa', true) }}"
          ansible_ssh_common_args: "-o IdentitiesOnly=yes"
