#
# dev inventory. No credentials are stored here.
# The application talks to Bamboo at https://127.0.0.1 (hardcoded in lib/bamboo_ci), so it must run on the Bamboo host.
all:
  children:
    netdef_ci_servers:
      hosts:
        netdef-ci-ruby-dev:
          ansible_host: ci2.netdef.org
          ansible_user: root   # SSH account (must be able to sudo)
          # Only one key is offered (the ssh agent may hold many). Override with: export NETDEF_SSH_KEY=~/.ssh/<other key>
          ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'NETDEF_SSH_KEY') | default('~/.ssh/id_rsa', true) }}"
          ansible_ssh_common_args: "-o IdentitiesOnly=yes"
