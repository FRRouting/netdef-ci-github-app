# Non-secret settings of prod_frr_public, the PRODUCTION instance for the main FRR repository on GitHub (FRRouting/frr).
# Its pull requests start the Bamboo plan FRR-PULLREQ3 on ci1.netdef.org; the repository-to-plan link is a row of the
# `plans` table, not an Ansible variable. Secrets live in vault.yml (see vault.yml.example).
netdef_ci_env: production
netdef_ci_version: REPLACE_WITH_RELEASE_TAG_OR_COMMIT   # production deploys must name an explicit tag/commit
netdef_ci_repo_url: REPLACE_WITH_REPOSITORY_URL

netdef_ci_listen_host: 0.0.0.0
netdef_ci_listen_port: 4667                  # production port
netdef_ci_web_workers: 4
netdef_ci_keep_releases: 5

netdef_ci_debug: false
netdef_ci_ci_host: ci1.netdef.org

netdef_ci_timers:
  watchdog: {enabled: true, on_calendar: "*:0/15"}
  pr_sync: {enabled: true, on_calendar: "hourly"}

# The current manual installation (deployment/github_server.service, user githubchecks) listens on the same port:
# list its unit here to stop and disable it on the first deploy, and remove its cron entries by hand.
# netdef_ci_legacy_units: [github_server.service]
