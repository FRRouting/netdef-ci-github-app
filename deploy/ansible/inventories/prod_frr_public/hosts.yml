#
# prod_frr_public inventory: production instance for the main FRR repository on GitHub (FRRouting/frr), which starts
# the Bamboo plan FRR-PULLREQ3 (https://ci1.netdef.org/browse/FRR-PULLREQ3); see doc/general/ansible-deploy.md.
# The application talks to Bamboo at https://127.0.0.1, so the server is the Bamboo host.
# REPLACE the placeholders below; no real server address is stored in this repository.
all:
  children:
    netdef_ci_servers:
      hosts:
        netdef-ci-ruby-prod:
          ansible_host: ci1.netdef.org
          ansible_user: root   # SSH account (must be able to sudo)
          # Only one key is offered (the ssh agent may hold many). Override with: export NETDEF_SSH_KEY=~/.ssh/<other key>
          ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'NETDEF_SSH_KEY') | default('~/.ssh/id_rsa', true) }}"
          ansible_ssh_common_args: "-o IdentitiesOnly=yes"
